name: Deploy Frontend to Layero

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layero-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      LAYERO_SITE_ID: ${{ vars.LAYERO_SITE_ID }}

    steps:
      - name: Check Layero site ID
        run: |
          : "${LAYERO_SITE_ID:?Set the LAYERO_SITE_ID repository variable}"

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Deploy to Layero
        uses: LayeroInfra/deploy-action@e22ae1eceedfd213b9e5bd955a8f3ade8aaa52a1 # v1
        with:
          token: ${{ secrets.LAYERO_TOKEN }}
          project: ${{ env.LAYERO_SITE_ID }}
          prebuilt: dist
          version: '0.11.34'
